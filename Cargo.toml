[package]
name = "lmp"
version = "0.1.0"
edition = "2024"

# Сборка macOS-приложения: cargo bundle --release
[package.metadata.bundle]
name = "LMP"
identifier = "com.fedor-ivanov.lmp"
icon = ["assets/images/AppIcon.icns"]
category = "public.app-category.music"
short_description = "Audio player"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
lofty = "0.25.4"
symphonia = { version = "0.6.1", features = [
    "mp3",
    "flac",
    "wav",
    "ogg",
    "aac",
    "isomp4",
] }
rodio = "0.23.0"
egui = "0.37.0"
# persistence — ради eframe::storage_dir (папка данных для библиотеки); заодно eframe
# запоминает размер окна и ширину панелей между запусками
eframe = { version = "0.37", features = ["persistence"] }
rfd = "0.17.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
fastrand = "2"
raw-window-handle = "0.6"
encoding_rs = "0.8.42"
# Системные медиа-кнопки и «Пункт управления» (macOS), панель мультимедиа (Windows)
souvlaki = "0.8.3"
# Запросы текстов песен в LRCLIB (см. src/core/lyrics/lrclib.rs)
ureq = { version = "3.5.0", features = ["json"] }

# Системное размытие под прозрачным окном (см. src/window_glass.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.3", features = [
    "NSAppearance",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
] }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8.1"

[build-dependencies]
winresource = "0.1.34"
