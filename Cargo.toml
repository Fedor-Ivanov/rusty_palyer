[package]
name = "lmp"
version = "0.1.0"
edition = "2024"

# Сборка macOS-приложения: cargo bundle --release
[package.metadata.bundle]
name = "LMP"
identifier = "com.fedor-ivanov.lmp"
icon = ["assets/images/AppIcon.icns"]
category = "public.app-category.music"
short_description = "Audio player"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
lofty = "0.25.4"
symphonia = { version = "0.6.1", features = [
    "mp3",
    "flac",
    "wav",
    "ogg",
    "aac",
    "isomp4",
] }
rodio = "0.23.0"
egui = "0.37.0"
# persistence — ради eframe::storage_dir (папка данных для библиотеки); заодно eframe
# запоминает размер окна и ширину панелей между запусками
eframe = { version = "0.37", features = ["persistence"] }
rfd = "0.17.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
fastrand = "2"
raw-window-handle = "0.6"
encoding_rs = "0.8.42"
# Системные медиа-кнопки и «Пункт управления» (macOS), панель мультимедиа (Windows)
souvlaki = "0.8.3"
# Запросы текстов песен в LRCLIB (см. src/core/lyrics/lrclib.rs)
ureq = { version = "3.5.0", features = ["json"] }

# Системное размытие под прозрачным окном (см. src/ui/style/window_glass.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.3", features = [
    "NSAppearance",
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# На Windows окно рисуется через OpenGL (glow), а не wgpu — см. window_glass.rs
eframe = { version = "0.37", features = ["glow"] }
window-vibrancy = "0.8.1"
# Стекло окна (src/ui/style/window_glass.rs) и положение курсора, пока над окном
# перетаскивают файлы (src/ui/file_drop.rs)
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

# Отладочная сборка (cargo run): зависимости — с оптимизациями. Без них декодирование
# обложек (image), чтение тегов и звука идут в разы медленнее: обложка готовится ~110 мс
# вместо ~6. Свой код остаётся отладочным; зависимости собираются так один раз
[profile.dev.package."*"]
opt-level = 3
