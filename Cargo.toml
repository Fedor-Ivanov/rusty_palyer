[package]
name = "rusty_player"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25.4"
symphonia = { version = "0.6.1", features = [
    "mp3",
    "flac",
    "wav",
    "ogg",
    "aac",
    "isomp4",
] }
rodio = "0.23.0"
egui = "0.37.0"
eframe = "0.37"
rfd = "0.17.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
